apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iko.fullname" . }}
  labels:
    {{- include "iko.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "iko.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.extraConfigMaps }}
        checksum/extra-configmaps: {{ toYaml .Values.extraConfigMaps | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "iko.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "iko.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "iko.fullname" .) }}
            - configMapRef:
                name: {{ include "iko.fullname" . }}
            {{- if .Values.extraConfigMaps }}
            {{- range .Values.extraConfigMaps }}
            {{- $mode := .mode | default "both" }}
            {{- if or (eq $mode "env") (eq $mode "both") }}
            - configMapRef:
                name: {{ .name }}
            {{- end }}
            {{- end }}
            {{- end }}

          env:
            {{- if .Values.extraEnvVars }}
            {{- include "iko.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.settings.management.enabled }}
            - name: management
              containerPort: {{ .Values.settings.management.port }}
              protocol: TCP
            {{- end }}

          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.extraVolumeMounts }}
            {{- include "iko.tplvalues.render" ( dict "value" .Values.extraVolumeMounts "context" $ ) | nindent 12 }}
            {{- end }}
            {{- if .Values.extraConfigMaps }}
            {{- range .Values.extraConfigMaps }}
            {{- $mode := .mode | default "both" }}
            {{- if or (eq $mode "mount") (eq $mode "both") }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | default (printf "/config/%s" .name) }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}

      volumes:
        {{- if .Values.extraVolumes }}
        {{- include "iko.tplvalues.render" ( dict "value" .Values.extraVolumes "context" $ ) | nindent 8 }}
        {{- end }}
        {{- if .Values.extraConfigMaps }}
        {{- range .Values.extraConfigMaps }}
        {{- $mode := .mode | default "both" }}
        {{- if or (eq $mode "mount") (eq $mode "both") }}
        - name: {{ .name }}
          configMap:
            name: {{ .name }}
        {{- end }}
        {{- end }}
        {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}