# Default values for iko.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Amount of replicas running IKO
replicaCount: 1

image:
  # -- Domain of the image repository
  repository: ""
  # -- Pull policy for the image
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # -- If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: iko.example.com
      paths:
        - path: /admin
          pathType: Prefix
        - path: /assets
          pathType: Prefix
        - path: /oauth2
          pathType: Prefix
        - path: /login/oauth2
          pathType: Prefix
  tls: []
  #  - secretName: iko-example-tls
  #    hosts:
  #      - iko.example.com

ports:
- name: admin-port
  containerPort: 8080

startupProbe:
  httpGet:
    path: /actuator/health
    port: management
  failureThreshold: 90
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 120
  periodSeconds: 10
  failureThreshold: 6

# -- Extra environment variables to inject into the container
extraEnvVars: []
# -- Additional volume mounts for the main container
extraVolumeMounts: []
# -- Additional volumes to attach to the pod
extraVolumes: []

resources:
  requests:
    memory: 1536Mi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 2000m

persistence:
  # -- Enable/disable persistent volumes for iko
  enabled: false
  # -- Extra labels to add to the PVC metadata
  extraPvcLabels: {}
  # -- Finalizers to add to the PVC
  finalizers: []
  annotations: {}
  # -- Access modes for the PVC
  accessModes:
    - ReadWriteOnce
  # -- persistence.size Size of data volume
  size: 1Gi
  # -- persistence.storageClassName Storage class of backing PVC
  # -- If defined, storageClassName: <storageClassName>
  # -- If set to "-", storageClassName: "", which disables dynamic provisioning
  # -- If undefined (the default) or set to null, no storageClassName spec is
  # -- set, choosing the default provisioner.  (gp2 on AWS, standard on
  # -- GKE, AWS & OpenStack)
  # --
  storageClassName: ""
  # -- Additional selector labels for the PVC
  selectorLabels: {}
  # -- persistence.existingClaim The name of an existing PVC to use for persistence
  existingClaim: null
  # -- persistence.mountPath Path to mount the volume at.
  mountPath: /tmp

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

nodeSelector: {}

tolerations: []

affinity: {}

existingSecret: null

## Monitoring
monitoring:
  podMonitor:
    enabled: false
    # -- Interval between Prometheus scrapes
    interval: ""
    # -- Scrape timeout for the PodMonitor
    scrapeTimeout: ""

settings:
  spring:
    datasource: 
      # -- URL for the postgresql database
      url: ""
      # -- Username for the postgresql database
      username: ""
      # -- Password for the postgresql database
      password: "TOPSECRET"
      # -- Driver for the postgresql database
      driverClassName: "org.postgresql.Driver"
    jpa:
      properties:
        hibernateDialect: "org.hibernate.dialect.PostgreSQLDialect"

  keycloak: 
    # -- URL of Keycloak - Required
    authServerURL: ""
    # -- Keycloak realm - Required
    realm: ""
    # -- Client-ID to connect with Keycloak
    clientID: ""
    # -- Client-Secret to connect with Keycloak.
    # -- Or, if using existingSecret: `SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENTSECRET`
    clientSecret: ""

  redis:
    host:
    port: 

  iko:
    # -- Port IKO listens on
    serverPort: 8080
    security:
      admin:
        # -- Claim containing admin roles in OIDC login tokens
        rolesClaim: "roles"
        # -- Required admin roles/authorities (comma-separated)
        authorities: "ROLE_ADMIN"
        session:
          # -- Admin session timeout duration. Must use Spring duration format (e.g., 30m, 1h).
          timeout: "30m"
          # -- Time before session expiry to show the timeout warning modal.
          warningBefore: "2m"
      api:
        # -- Claim containing API authorities in JWT access tokens
        authoritiesClaim: "resource_access.iko.roles"
      # -- Secure flag for session cookie (JSESSIONID and XSRF-TOKEN). Set to true when running behind HTTPS.
      sessionCookieSecure: false
    # -- Base64-encoded 256-bit random key for AES encryption
    # -- Generate a key, by e.g.: openssl rand -base64 32
    # -- Or, if using existingSecret: `IKO_CRYPTO_KEY`
    cryptoKey: ""

redis:
  # -- Enable/disable the bundled Redis deployment
  enabled: true
  # -- Number of Redis replicas
  replicaCount: 1
  image:
    # -- Redis image repository
    repository: docker.io/redis
    # -- Redis image tag
    tag: "8.4.0"
    # -- Redis image pull policy
    pullPolicy: IfNotPresent
  service:
    # -- Port Redis listens on
    port: 6379
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 250m
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -- extraConfigMapsEnabled: controls whether ConfigMap resources are created by this chart.
# -- Set to false to reference pre-existing ConfigMaps without having the chart create them.
extraConfigMapsEnabled: true

# -- List of ConfigMaps to create (when `extraConfigMapsEnabled=true`) and inject into the pod.
# Each entry supports: `name` (required), `mode` (env/mount/both, default: both),
# `mountPath` (default: /config/<name>), `data` (map of key → content).
# NOTE: env vars set elsewhere in this chart take precedence over values in a mounted application.yaml.
# Example:
# ```yaml
# - name: my-app-config
#   mode: both
#   mountPath: /app/config
#   data:
#     application.yaml: |
#       server.port: 8080
# ```
extraConfigMaps: []
